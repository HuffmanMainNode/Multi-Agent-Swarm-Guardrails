name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,tuf,spiffe]"
      - name: Ruff static checks
        run: ruff check src/masg/broker.py src/masg/trust.py src/masg/identity.py src/masg/cli.py tests/test_tuf_policy.py tests/test_identity.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Structural verifier
        run: masg verify --root .
      - name: JSON syntax
        run: |
          python -m json.tool contracts/manifest.json > /dev/null
          python -m json.tool examples/policy.json > /dev/null
          python -m json.tool examples/request.json > /dev/null
          python -m json.tool examples/broker-policy.example.json > /dev/null
          python -m json.tool examples/broker-principals.example.json > /dev/null
          for file in schemas/*.json vectors/v1.0.0/*.json implementations/go/*.json implementations/rust/*.json implementations/javascript/*.json extensions/examples/generic-tool-action/*.json; do python -m json.tool "$file" > /dev/null; done

  go-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: implementations/go/go.mod
      - name: Go vet
        working-directory: implementations/go
        run: go vet ./...
      - name: Go tests against shared protocol vectors
        working-directory: implementations/go
        run: go test -race -count=1 ./...

  rust-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        working-directory: implementations/rust
        run: cargo fmt --check
      - name: Rust clippy
        working-directory: implementations/rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests against shared protocol vectors
        working-directory: implementations/rust
        run: cargo test --locked

  javascript-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript tests against shared protocol vectors
        working-directory: implementations/javascript
        run: node --test
