[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masg-guardrails"
version = "0.1.0"
description = "Portable safety contracts and reference enforcement for autonomous agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MrCakes931" }]
keywords = ["ai-agents", "agent-security", "multi-agent-systems", "authorization", "conformance"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
tuf = ["tuf>=7.0,<8.0", "securesystemslib[crypto]>=1.0"]
spiffe = ["spiffe==0.4.0"]

[project.scripts]
masg = "masg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
